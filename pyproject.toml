[project]
name = "agentic-rl"
version = "0.1.0"
description = "Experiments and training infrastructure for agentic reinforcement learning."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.0",
    "pyarrow>=25.0.1",
    "regex>=2026.9.29",
]

[project.scripts]
atif-to-hf-trace = "agentic_rl.atif_to_hf:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "pytest>=8.4",
    "ruff>=0.12",
    "types-regex>=2026.9.29.20261005",
]
train = [
    "httpx>=0.28.1",
    "openai-harmony>=0.0.8",
    "skyrl[fsdp]",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rl"]

# skyrl comes from a checkout of its v0.3.0 release (f5bc3b78), not PyPI: uv only reads [tool.uv] settings from the
# root project, so skyrl's indexes and overrides for its CUDA wheels are mirrored below (fsdp extra only, x86_64).
# Re-sync from skyrl's pyproject.toml when bumping. One-time setup:
#   git clone --branch skyrl-v0.3.0 https://github.com/NovaSky-AI/SkyRL ~/oss/SkyRL-v0.3.0
[tool.uv]
# vLLM and torch are only resolved for Linux.
environments = ["sys_platform == 'linux'"]
# Only use uv-managed Python builds: a non-standard system Python can ship its own glibc and loader, under which
# vLLM's CUDA extension cannot resolve cuBLAS symbols.
python-preference = "only-managed"
override-dependencies = [
    "transformers>=5.6.1,<=5.8.0; sys_platform == 'linux'",
    "nixl-cu13; sys_platform == 'never'",
    "flashinfer-python==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-jit-cache==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-cubin==0.6.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # skyrl's vllm-router build needs glibc 2.35 (this host has 2.34); PyPI's 0.1.15 has the fix it carries.
    "vllm-router==0.1.15; sys_platform == 'linux'",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu128"
url = "https://flashinfer.ai/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.23.0/cu129"
explicit = true

[tool.uv.sources]
skyrl = { path = "/home/htkumar/oss/SkyRL-v0.3.0", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
flashinfer-jit-cache = { index = "flashinfer-cu128" }
# vllm 0.23.0's PyPI wheel needs CUDA 13; the cu129 wheel links libcudart.so.12, which torch+cu128 supplies.
vllm = { index = "vllm-cu129" }
# skyrl's builds against torch 2.11 (cu128, cp312, x86_64).
flash-attn = { url = "https://github.com/erictang000/flash-attention/releases/download/v2.8.3-torch2.11-clean/flash_attn-2.8.3-cp312-cp312-linux_x86_64.whl" }
causal-conv1d = { url = "https://github.com/erictang000/causal-conv1d/releases/download/v1.6.1.post4-torch2.11/causal_conv1d-1.6.1-cp312-cp312-linux_x86_64.whl" }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# skyrl's editable install is an import hook, which type checkers can't follow; point them at its checkout.
[tool.pyrefly]
search-path = [".", "src", "/home/htkumar/oss/SkyRL-v0.3.0"]

[tool.pyright]
extraPaths = [".", "src", "/home/htkumar/oss/SkyRL-v0.3.0"]
