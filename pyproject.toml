[project]
name = "agentic-rl"
version = "0.1.0"
description = "Experiments and training infrastructure for agentic reinforcement learning."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
atif-to-hf-trace = "agentic_rl.atif_to_hf:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rl"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
