<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trajectories</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --line: #e3e3df; --text: #1d1d1b; --muted: #6b6b66;
    --good: #1f7a3a; --good-bg: #e3f4e8; --bad: #b42318; --bad-bg: #fde8e6;
    --accent: #2f5bd3; --user: #8a4fbf; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1150px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 16px; align-items: center; }
  .bar h1 { font-size: 16px; margin: 0; }
  .bar h1 a { color: inherit; text-decoration: none; }
  select, input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  main { max-width: 1150px; margin: 0 auto; padding: 20px; }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); }
  .mono, code { font-family: var(--mono); font-size: 12.5px; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 120px; }
  .stat b { display: block; font-size: 20px; }
  .stat b.good { color: var(--good); }
  .stat b.bad { color: var(--bad); }
  .stat span { color: var(--muted); font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #eeeeea; font-size: 12px; margin: 2px 4px 2px 0; white-space: nowrap; }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ttext { max-width: 640px; color: var(--muted); font-size: 12.5px; }
  .chip { display: inline-block; min-width: 38px; text-align: center; border-radius: 5px; font-size: 12px; margin-right: 3px; padding: 1px 4px;
          font-variant-numeric: tabular-nums; color: inherit; text-decoration: none; }
  .crumbs { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .crumbs .spacer { flex: 1; }
  .btn { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; text-decoration: none; color: var(--text); }
  .btn:hover { background: #f0f0ec; }
  .btn[disabled] { opacity: 0.4; cursor: default; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 6px 0 14px; }
  .tab { padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); text-decoration: none; }
  .tab.active { border-color: var(--text); color: var(--text); font-weight: 600; }
  .msg { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .msg.agent { border-left-color: var(--accent); }
  .msg.user { border-left-color: var(--user); }
  .msg.tool { border-left-color: #b8b8b0; background: #fbfbf9; }
  .msg.error { border-left-color: var(--bad); }
  .msg-head { display: flex; gap: 10px; align-items: baseline; padding: 6px 14px; font-size: 12px; }
  .msg-head .role { font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .msg.agent .role { color: var(--accent); }
  .msg.user .role { color: var(--user); }
  .msg-head .meta { color: var(--muted); margin-left: auto; }
  .msg-body { padding: 0 14px 10px; display: flex; flex-direction: column; gap: 8px; }
  .text { white-space: pre-wrap; word-break: break-word; }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details.reasoning { border-left: 3px solid #d9d4c3; padding-left: 10px; }
  details.reasoning > summary { color: var(--muted); }
  details.reasoning[open] > summary .preview { display: none; }
  details.reasoning .text { color: #45453f; margin-top: 4px; }
  details.result > summary { color: var(--muted); font-size: 12.5px; }
  details.result[open] > summary .preview { display: none; }
  .call { background: #f4f6fb; border-radius: 8px; padding: 8px 10px; }
  .call .tool { font-family: var(--mono); font-weight: 600; color: var(--accent); }
  pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12.5px; }
  .doc { max-height: 420px; overflow: auto; }
  .err { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 10px; }
  .end { text-align: center; padding: 10px; color: var(--muted); }
  details.ctx { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; margin-bottom: 10px; }
  details.ctx > summary { font-weight: 600; }
  details.ctx .text { margin-top: 8px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><a href="#" id="home">Trajectories</a></h1>
    <select id="run-select" title="Run"></select>
    <span class="muted" id="run-note"></span>
  </div>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<script>
const app = document.getElementById("app");
const runSelect = document.getElementById("run-select");
const state = { runs: [], indexCache: {}, search: "" };

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}
const scoreColor = v => `hsl(${Math.round(v * 120)}, 55%, ${v > 0 ? 86 : 92}%)`;
const params = () => new URLSearchParams(location.hash.slice(1));
const hashFor = obj => "#" + new URLSearchParams(Object.entries(obj).filter(([, v]) => v !== undefined && v !== null && v !== "")).toString();
const preview = (s, n = 160) => { const t = String(s).replace(/\s+/g, " "); return t.length > n ? t.slice(0, n) + "…" : t; };

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: ${res.status} ${(await res.json().catch(() => ({}))).error ?? ""}`);
  return res.json();
}

async function init() {
  const meta = await getJSON("/api/runs");
  state.runs = meta.runs;
  document.title = `${meta.source} trajectories`;
  document.getElementById("home").textContent = `${meta.source} trajectories`;
  runSelect.innerHTML = state.runs.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("");
  runSelect.onchange = () => { location.hash = hashFor({run: runSelect.value}); };
  document.getElementById("home").onclick = e => { e.preventDefault(); location.hash = hashFor({run: runSelect.value}); };
  if (!state.runs.length) { app.innerHTML = `<p class="muted">No runs in ${esc(meta.runs_dir)}.</p>`; return; }
  window.onhashchange = route;
  route();
}

async function route() {
  const p = params();
  const run = p.get("run") || state.runs[0];
  runSelect.value = run;
  try {
    if (p.get("task") !== null && p.get("t") !== null) await renderTrial(run, p.get("task"), Number(p.get("t")), p.get("tab") || "conversation");
    else await renderIndex(run);
  } catch (err) {
    app.innerHTML = `<div class="err">${esc(err.message)}</div>`;
  }
}

// ---------- Index: tasks and their trials ----------

async function renderIndex(run) {
  const data = state.indexCache[run] ??= await getJSON(`/api/runs/${encodeURIComponent(run)}`);
  document.getElementById("run-note").textContent = "";
  app.innerHTML = `
    <div class="stats">${data.summary.map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("")}</div>
    <div class="card">${data.info.map(i => `<span class="muted">${esc(i.label)}:</span> <code>${esc(i.value)}</code>`).join(" &nbsp;·&nbsp; ")}</div>
    <div class="toolbar"><input id="search" placeholder="Search task id or text" size="40" value="${esc(state.search)}"></div>
    <table>
      <thead><tr><th>Task</th><th class="num">Mean ${esc(data.score_label)}</th><th>${esc(data.score_label)} per trial</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>`;
  const search = document.getElementById("search");
  search.oninput = () => { state.search = search.value; drawRows(run, data); };
  drawRows(run, data);
}

function drawRows(run, data) {
  const needle = state.search.toLowerCase();
  const rows = data.tasks.filter(t => !needle || `${t.id} ${t.title}`.toLowerCase().includes(needle)).map(t => {
    const mean = t.trials.reduce((a, x) => a + x.score, 0) / t.trials.length;
    const chips = t.trials.map(x => `<a class="chip" style="background:${scoreColor(x.score)}" title="trial ${x.trial}: ${esc(x.note)}"
        href="${hashFor({run, task: t.id, t: x.trial})}">${Number(x.score).toFixed(2).replace(/\.00$/, "")}</a>`).join("");
    return `<tr><td><a class="mono" href="${hashFor({run, task: t.id, t: t.trials[0].trial})}"><b>${esc(t.id)}</b></a>
              <div class="ttext">${esc(preview(t.title, 220))}</div></td>
            <td class="num"><b>${mean.toFixed(2)}</b></td><td>${chips}</td></tr>`;
  });
  document.getElementById("rows").innerHTML = rows.join("") || `<tr><td colspan="3" class="muted">No matching tasks.</td></tr>`;
}

// ---------- Trial: conversation and verifier ----------

async function renderTrial(run, taskId, trial, tab) {
  const d = await getJSON(`/api/runs/${encodeURIComponent(run)}/${encodeURIComponent(taskId)}/${trial}`);
  const i = d.trials.indexOf(trial);
  const link = (task, t, label) => task === null || t === undefined
    ? `<button class="btn" disabled>${label}</button>`
    : `<a class="btn" href="${hashFor({run, task, t, tab})}">${label}</a>`;
  app.innerHTML = `
    <div class="crumbs">
      <a href="${hashFor({run})}">${esc(run)}</a><span class="muted">/</span>
      <b class="mono">task ${esc(taskId)}</b><span class="muted">/</span><b>trial ${trial}</b>
      <span class="spacer"></span>
      ${link(d.prev_task, 0, "← Prev task")} ${link(taskId, d.trials[i - 1], "← Prev trial")}
      ${link(taskId, d.trials[i + 1], "Next trial →")} ${link(d.next_task, 0, "Next task →")}
    </div>
    <div class="stats">${d.stats.map(s => `<div class="stat"><b class="${s.status ?? ""}">${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("")}</div>
    <div class="card"><div class="text">${esc(d.title)}</div></div>
    ${d.context.map(c => `<details class="ctx"><summary>${esc(c.title)}</summary><div class="text">${esc(c.text)}</div></details>`).join("")}
    <div class="tabs">
      <a class="tab ${tab === "conversation" ? "active" : ""}" href="${hashFor({run, task: taskId, t: trial})}">Conversation</a>
      <a class="tab ${tab === "verifier" ? "active" : ""}" href="${hashFor({run, task: taskId, t: trial, tab: "verifier"})}">Verifier</a>
    </div>
    <div id="tab-body"></div>`;
  const body = document.getElementById("tab-body");
  if (tab === "verifier") body.innerHTML = verifierHTML(d);
  else {
    body.innerHTML = conversationHTML(d);
    const toggle = (sel, open) => body.querySelectorAll(sel).forEach(x => x.open = open);
    document.getElementById("open-reasoning").onclick = () => toggle("details.reasoning", true);
    document.getElementById("close-reasoning").onclick = () => toggle("details.reasoning", false);
    document.getElementById("open-results").onclick = () => toggle("details.result", true);
    document.getElementById("close-results").onclick = () => toggle("details.result", false);
  }
}

function conversationHTML(d) {
  const msgs = d.messages.map(m => {
    const parts = [];
    if (m.reasoning) parts.push(`<details class="reasoning"><summary>💡 Reasoning <span class="preview">— ${esc(preview(m.reasoning))}</span></summary>
                                   <div class="text">${esc(m.reasoning)}</div></details>`);
    if (m.role === "tool") {
      parts.push(`<details class="result"><summary>← result <span class="preview">— ${esc(preview(m.text, 120))}</span></summary>
                    <pre class="doc">${esc(m.text)}</pre></details>`);
    } else if (m.text) parts.push(`<div class="text">${esc(m.text)}</div>`);
    for (const c of m.tool_calls) {
      parts.push(`<div class="call"><span class="tool">→ ${esc(c.name)}</span><pre>${esc(JSON.stringify(c.arguments, null, 2))}</pre></div>`);
    }
    return `<div class="msg ${esc(m.role)} ${m.error ? "error" : ""}">
              <div class="msg-head"><span class="role">${esc(m.role)}</span>${m.error ? `<span class="pill bad">error</span>` : ""}
                <span class="meta">${esc(m.meta ?? "")}</span></div>
              <div class="msg-body">${parts.join("")}</div></div>`;
  });
  return `
    <div class="toolbar">
      <button class="btn" id="open-reasoning">Expand all reasoning</button>
      <button class="btn" id="close-reasoning">Collapse all reasoning</button>
      <button class="btn" id="open-results">Expand all tool results</button>
      <button class="btn" id="close-results">Collapse all tool results</button>
    </div>
    ${msgs.join("")}
    <div class="end">${esc(d.end)} <a href="${hashFor({...Object.fromEntries(params()), tab: "verifier"})}">See the verifier →</a></div>`;
}

function verifierHTML(d) {
  return d.verifier.map(sec => {
    const inner = sec.rows
      ? `<table><tbody>${sec.rows.map(r => `<tr><td>${esc(r.label)}</td>
           <td class="num">${r.status ? `<span class="pill ${r.status}">${esc(r.value)}</span>` : esc(r.value)}</td></tr>`).join("")}</tbody></table>`
      : `<pre>${esc(sec.text)}</pre>`;
    return `<div class="card"><div style="font-weight:600;margin-bottom:6px">${esc(sec.title)}</div>${inner}</div>`;
  }).join("");
}

init().catch(err => { app.innerHTML = `<div class="err">${esc(err.message)}</div>`; });
</script>
</body>
</html>
